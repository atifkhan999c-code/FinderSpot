<!-- Reusable Item Card Component Template -->
<div class="item-card bg-white rounded-2xl overflow-hidden border border-slate-200/80 shadow-sm hover:shadow-lg transition-all group flex flex-col">
  <div class="relative h-48 overflow-hidden bg-slate-100">
    <img src="{{image}}" alt="{{title}}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
    <span class="absolute top-3 left-3 px-2.5 py-1 rounded-full text-xs font-bold {{badgeClass}}">
      {{typeBadge}}
    </span>
    {{rewardPill}}
  </div>
  <div class="p-5 flex flex-col flex-grow">
    <div class="text-xs font-semibold uppercase tracking-wider mb-1 text-slate-500">{{category}}</div>
    <h3 class="font-bold text-slate-900 text-base group-hover:text-indigo-600 transition-colors line-clamp-1">{{title}}</h3>
    <p class="text-xs text-slate-500 mt-2 line-clamp-2">{{description}}</p>
    <div class="mt-4 pt-3 border-t border-slate-100 space-y-1.5 text-xs text-slate-500 flex-grow">
      <div class="flex items-center gap-2"><i class="fas fa-map-marker-alt text-rose-500 w-3.5"></i> <span class="truncate">{{location}}</span></div>
      <div class="flex items-center gap-2"><i class="far fa-clock text-slate-400 w-3.5"></i> <span>{{date}}</span></div>
    </div>
    <a href="item-details.html?id={{id}}" class="mt-4 w-full py-2 px-3 rounded-xl bg-slate-100 text-slate-700 hover:bg-indigo-600 hover:text-white font-semibold text-xs text-center transition-colors">
      View Details
    </a>
  </div>
</div>
