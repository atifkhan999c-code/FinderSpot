version: '3.8'

services:
  # ==========================================
  # 1. MongoDB Database Container
  # ==========================================
  mongodb:
    image: mongo:7.0
    container_name: finderspot-mongodb
    restart: always
    environment:
      MONGO_INITDB_DATABASE: lost_and_found_db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - finderspot-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # 2. Node.js + Express + Frontend Web Server
  # ==========================================
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: finderspot-app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/lost_and_found_db
      - JWT_SECRET=super_secret_jwt_key_finderspot_2026_campus_auth
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - uploads_data:/app/backend/uploads
    networks:
      - finderspot-net

# ==========================================
# Persistent Volumes (Data Survives Restarts)
# ==========================================
volumes:
  mongodb_data:
    driver: local
  uploads_data:
    driver: local

# ==========================================
# Isolated Container Network
# ==========================================
networks:
  finderspot-net:
    driver: bridge
