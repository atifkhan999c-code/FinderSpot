services:
  - type: web
    name: finderspot-app
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        value: https://aebtvrohmvuhjqzrigkz.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_Q1wkwasxwjyB-_ftCrDyww_sSSJzGvq
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: APP_BASE_URL
        fromService:
          type: web
          name: finderspot-app
          property: host
